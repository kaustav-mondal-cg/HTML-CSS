<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

<img 
  src="400 w.png"
  srcset="400 w.png 400w, 800 w.png 800w, 1200 w.png 1200w"
  sizes="(max-width: 600px) 100vw,
       (max-width: 1000px) 80vw,
       1200px"
  alt="Responsive image">
</body>
</html>
