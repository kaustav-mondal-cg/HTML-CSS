<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <header>
        <h1>Registration Form</h1>
    </header>
    <form action="">
        <label name="" id="">First Name:</label>
        <input type="text" name="" id="">
        <br>
        <label name="" id="">Last Name:</label>
        <input type="text" name="" id="">
        <br>
        <label name="" id="">Email:</label>
        <input type="email" name="" id="">
        <br>
        <label name="" id="">Password:</label>
        <input type="password" name="" id="">
        <br>
        <label name="" id="">Gender:</label>
        <br>
        <input type="radio" id="yes" name="subscribe" value="yes">
        <label for="yes">Male</label> 
        <br>
        <input type="radio" id="no" name="subscribe" value="no" >
        <label for="no">Female</label>
        <br>
        <input type="radio" id="no" name="subscribe" value="no">
        <label for="no">Other</label>
        <br>
        <lable name="" id="">Age:</lable>
        <input type="number" name="" id="" min="18">
        <br>
        <lable name="" id="">DOB:</lable>
        <input type="date" name="" id="" max="2008-08-26">
        <br>
        <label name="" id="">Preference:</label>
        <br>
        <input type="checkbox" name="preference" id="Acrylic Painting" value="Acrylic Painting" >
        <lable for="Acrylic Painting">Acrylic Painting</lable>
        <br>
        <input type="checkbox" name="preference" id="Oil Painting " value="Oil Painting" >
        <lable for="Oil Painting">Oil Painting</lable>
        <br>
        <input type="checkbox" name="preference" id="Water Color Painting" value="Water Color Painting" >
        <lable for="Water Color Painting">Water Color Painting</lable>
        <br>
        <lable name="" id="">Select Occupation:</lable>
        <select name="status">
        <option value="action" id="">Student</option>
        <option value="action" id="">Teacher</option>
        </select>
        <br>
         <lable id="">Bio:</lable>
         <textarea name="message" rows="5" cols="50" id="">Share few lines about yourself...</textarea>
        <br>
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
