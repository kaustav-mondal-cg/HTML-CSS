<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <caption>Monthly Workshop Schedule</caption>
        <thead>
        <tr>
            <th scope="col" id="Course">Course Name</th>
            <th scope="col" colspan="2" id="NameAndAge">Name and Age</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td rowspan="2" headers="Course">Web Development</td>
            <td headers="NameAndAge">John Doe</td>
            <td headers="NameAndAge">30</td>
        </tr>
        <tr>
            <td headers="NameAndAge">Jane Smith</td>
            <td headers="NameAndAge">25</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="3">End of Report</td>
        </tfoot>
    </table>
</body>
</html>
