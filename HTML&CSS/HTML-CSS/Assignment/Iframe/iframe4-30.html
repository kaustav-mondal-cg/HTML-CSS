<!DOCTYPE html>
<html>
<head>
<style>
iframe {
    border: none;
    margin: 10px;
}
</style>
</head>
<body>

<!-- Normal webpage needs no special permissions -->
<iframe src="https://www.example.com" width="100%" height="300" title="Normal Website"></iframe>

<!-- Fullscreen and gyroscope are needed for interactive content -->
<iframe src="https://www.example.com" width="100%" height="400" allow="fullscreen; gyroscope" title="Interactive Content"></iframe>

<!-- USB permission is needed for device content -->
<iframe src="https://device.example.com" width="600" height="400" allow="usb" title="USB Device"></iframe>

</body>
</html>
